# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "FixedOrderFactor: the order-r correction factor for mean squares of L(1, chi), and the factor 35/34"
  description: >-
    For an integer r >= 2 and a finite set N of primes, the random Euler product model for
    Dirichlet characters of order r replaces chi(q) by independent uniform r-th roots of unity.
    The development proves that the order-r local factor E|1 - z/q|^(-2) equals
    (1 + q^-r)/((1 - q^-2)(1 - q^-r)), that its ratio to the full-circle factor (1 - q^-2)^(-1),
    multiplied over the primes outside N, is zeta^(N)(r)^2 / zeta^(N)(2r), that this correction
    factor is also the sum of (ab)^-r over the coprime pairs of integers prime to N, and that the
    model mean is zeta^(N)(2) zeta^(N)(r)^2 / zeta^(N)(2r). The factor exceeds 1, decreases
    strictly in r and tends to 1; for r = 2k and N empty it equals -binom(4k,2k) B_{2k}^2/(2 B_{4k}).
    For r = 4 and N = {2} it is 35/34, the ratio by which the limit of Louboutin's mean square of
    L(1, chi) with the factor at 2 removed changes when the average is restricted to quartic
    characters; with the forced factor 4/5 at 2 the development also proves the constants pi^2/10,
    7 pi^2/68, 7 pi^2/36 and 7/136 = (1/20)(35/34) = (7/72)(9/17). It also identifies the pairs
    the model keeps: for positive m, n the average of z^m conj(z^n) is 1 exactly when m/n is an r-th
    power in Q, that is when (m, n) = (d a^r, d b^r) with a, b coprime, and 0 otherwise. Modulo a
    single prime p with r | p - 1 it proves the finite-character counterpart: there are exactly r
    Dirichlet characters mod p with chi^r = 1, the sum of chi(a) conj(chi(b)) over them is r when
    a/b is a nonzero r-th power mod p and 0 otherwise, so every pair (d a^r, d b^r) prime to p
    survives with sum r; by contrast, summed over all characters mod p, chi(m) conj(chi(n)) has
    sum 0 for distinct m, n < p.
  authors:
    - "Joseph S. Farland"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Joseph S. Farland"

classification:
  arxiv: ["math.NT"]
