status:
  scope: >-
    Formalized: the definitions of zeta^(N)(s) as a series over integers prime to N, the
    correction factor, the r-th roots of unity, the local term |1 - z x|^(-2), its average over
    the r-th roots of unity, and the finite random model; Theorem 2.1 (the local factor and its
    limit as r grows); Theorem 3.1 (the Euler products for the correction factor and the model
    mean, as unconditional products over the primes outside N); Theorem 3.2 (the sum over coprime
    pairs); Proposition 3.3 (the pairs with m/n an r-th power are (d a^r, d b^r), and they are
    exactly the pairs kept by the model average E[z^m conj z^n]); Theorem 3.4 (the finite model
    and its limit); Theorem 3.5 (dependence on N, > 1, strictly decreasing in r, limit 1);
    Proposition 3.6 (the Bernoulli closed form for even r and N empty); Theorem 4.1 (35/34 and
    the quartic constants); Theorem 5.1 (for p prime and r | p - 1, the r characters with
    chi^r = 1 and their orthogonality relation) and Corollary 5.2 (the pairs (d a^r, d b^r)
    prime to p survive; the full family kills distinct m, n < p). Not formalized: the
    rationality sentence of Proposition 3.6 beyond the closed form, Remark 5.3, the density
    statement after Corollary 5.2, and Theorem 6.1, which is quoted from the author's
    manuscript and needs the prime ideal theorem over Q(zeta_r), the Chebotarev density theorem
    and Siegel's theorem.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

automation:
  methods:
    - method: "agent"
      models: ["Claude (Anthropic)"]
      framework: "Claude.ai with code execution"
      tool_setup: >-
        AI-assisted: the Lean code was drafted and repaired by Claude against the paper's
        statements and proofs, compiled locally with lake, and checked with Palomar's lake
        comparator script. The mathematics, statements and paper are the author's.
      cost:
        wall_time: "about one day"
        spend_usd: "subscription-based"
        hardware: "API-only plus local machine"
      prompting_notes: "The model was given the statements and proofs and asked to formalize them without sorry or native_decide."
  spend_usd: "subscription-based"
  notes: >-
    The author directed the scope (general order r and set N, constants and model only) and
    reviewed the formal statements in Challenge.lean against the paper. Exact rational arithmetic
    reproduces every numerical value in the paper.

fidelity:
  divergences: >-
    zeta^(N)(s) is defined for natural numbers s as a real series over n >= 1 divisible by no prime
    of N, and the infinite products are Mathlib's unconditional products (HasProd) over the subtype
    of primes not in N. The r-th roots of unity are exp(2 pi i j / r) for j = 0, ..., r-1, and the
    random model is the finite average over all maps from a finite set of primes to
    {0, ..., r-1}. The limit of the model is taken along the sets of primes q <= Y outside N. The
    Bernoulli closed form is stated for N empty; the general N case follows from the stated
    dependence on N. The quartic constants are stated with N = {2} encoded as the singleton of the
    prime 2.

review:
  status: "self-assessed"
  reviewers:
    - "Joseph S. Farland"
  notes: >-
    The author compared each statement in Challenge.lean with the corresponding result of the
    paper. The definitions in Challenge.lean are copied verbatim from the development and compared
    by Comparator. No external referee has reviewed the paper or the formalization.

