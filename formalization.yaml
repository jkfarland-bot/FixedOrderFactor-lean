sources:
  - title: "The factor 35/34: fourth powers in the mean square of L(1, chi) over quartic characters"
    authors:
      - "Joseph S. Farland"
    id: "https://doi.org/10.5281/zenodo.23491467"
    type: "article"
    location: "Preprint, version 2, Zenodo, 20 October 2026, https://doi.org/10.5281/zenodo.23491467 (version 1: https://doi.org/10.5281/zenodo.23488966; all versions: https://doi.org/10.5281/zenodo.23488965)"
    relationship: "formalizes"
    note: >-
      The paper and this formalization have the same author. In the numbering of version 2,
      Theorems 2.1, 3.1, 3.2, 3.4, 3.5, 4.1 and 5.1, Propositions 3.3 and 3.6 and Corollary 5.2
      are formalized. Remark 5.3 (exact order by Moebius inversion), the density statement after
      Corollary 5.2, and the passage from the model to the actual primes (Theorem 6.1, quoted from
      the author's manuscript on fixed-order families) are not.
      On novelty: the pairs with m/n an r-th power are the diagonal of Elliott's large sieve for
      characters of order k (Proc. London Math. Soc. 1970, Lemma 33) and appear in Lamzouri's work
      on large values of L(1, chi) for k-th order characters; the author found no prior statement of
      the value of the resulting constant or of its comparison with Louboutin's mean values.
    license: "CC-BY-4.0"
    author_endorsement: "participated"
  - title: "Quelques formules exactes pour des moyennes de fonctions L de Dirichlet"
    authors:
      - "Stéphane Louboutin"
    type: "article"
    location: "Canad. Math. Bull. 36 (1993), 190-196; corrections, ibid. 37 (1994), 89"
    relationship: "background"
    note: "Exact formulas and limits for the mean square of L(1, chi) over all odd characters, with Euler factors removed; Théorème 3 gives the limit pi^2/8 that the quartic family multiplies by 35/34."
    license: "unknown"
    author_endorsement: "not-contacted"
  - title: "An exact formula for an average of L-series"
    authors:
      - "H. Walum"
    type: "article"
    location: "Illinois J. Math. 26 (1982), 1-3"
    relationship: "background"
    note: "The mean square of L(1, chi) over the odd characters modulo a prime."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "On the mean value of f(p)"
    authors:
      - "P. D. T. A. Elliott"
    type: "article"
    location: "Proc. London Math. Soc. (3) 21 (1970), 28-96"
    relationship: "background"
    note: "Lemma 33, a large sieve for characters of order k to prime moduli, has as its diagonal the pairs whose ratio is a k-th power."
    license: "unknown"
    author_endorsement: "n/a"
  - title: "Large values of L(1, chi) for k-th order characters chi and applications to character sums"
    authors:
      - "Youness Lamzouri"
    type: "article"
    location: "Mathematika 63 (2017), 53-71"
    relationship: "background"
    note: "Lemma 2.6 and Remark 2.7 use the same diagonal for characters of order k."
    license: "unknown"
    author_endorsement: "not-contacted"

